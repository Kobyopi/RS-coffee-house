<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Coffee House - Menu</title>
        <link rel="icon" type="image/x-icon" href="../assets/logo.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <div class="container header-container">
                <a href="index.html" class="logo">
                    <img src="../assets/logo.png" alt="Coffee House Logo" class="logo-img">
                </a>
                <nav class="nav">
                    <ul class="nav">
                        <li class="nav-item"><a href="index.html#favorites" class="nav-link">Favorite coffee</a></li>
                        <li class="nav-item"><a href="index.html#about" class="nav-link">About</a></li>
                        <li class="nav-item"><a href="index.html#app" class="nav-link">Mobile app</a></li>
                        <li class="nav-item"><a href="#footer" class="nav-link">Contact us</a></li>
                    </ul>
                </nav>
                <span class="menu-btn btn disabled">Menu</span>
                <div class="burger-icon">
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div class="burger-menu">
                <nav class="burger-nav">
                    <ul class="burger-list">
                        <li class="burger-item"><a href="index.html#favorites" class="burger-link">Favorite coffee</a></li>
                        <li class="burger-item"><a href="index.html#about" class="burger-link">About</a></li>
                        <li class="burger-item"><a href="index.html#app" class="burger-link">Mobile app</a></li>
                        <li class="burger-item"><a href="#footer" class="burger-link">Contact us</a></li>
                        <li class="burger-item"><span class="burger-link burger-menu-link disabled">Menu</span></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="main">
            <section class="menu-section">
                <div class="container menu-container">
                    <h1 class="section title menu-title">Behind each of our cups hides an <span class="highlight">amazing surprise</span></h1>

                    <div class="menu-tabs">
                        <button class="menu-tab active" data-category="coffee">
                            <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                                <path d="M7.5 12.5v10a2.5 2.5 0 002.5 2.5h7.5a2.5 2.5 0 002.5-2.5v-10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M20 12.5V7.5A2.5 2.5 0 0017.5 5h-10A2.5 2.5 0 005 7.5v5c0 6.25 2.5 7.5 2.5 7.5M22.5 10h1.25a2.5 2.5 0 010 5H22.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Coffee
                        </button>
                        <button class="menu-tab" data-category="tea">
                            <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                                <path d="M22.5 11.25h-15v7.5a5 5 0 005 5h5a5 5 0 005-5v-7.5zM12.5 6.25V3.75M17.5 6.25V3.75M10 23.75v2.5M15 23.75v2.5M20 23.75v2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Tea
                        </button>
                        <button class="menu-tab" data-category="dessert">
                            <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                                <path d="M5.625 13.125h18.75M15 5v3.125M15 21.875V25M8.125 8.125L10 10M21.875 8.125L20 10M8.125 18.125L10 16.25M21.875 18.125L20 16.25M15 21.875a8.125 8.125 0 100-16.25 8.125 8.125 0 000 16.25z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Dessert
                        </button>
                    </div>

                    <div class="products-grid" id="productsGrid">
                        <!-- Dynamically loaded products -->
                    </div>

                    <button class="load-more-btn btn" id="loadMoreBtn" style="display: none;"></button>
                </div>
            </section>
        </main>

        
    </body>
</html>
